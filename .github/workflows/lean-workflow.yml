name: Lean Workflow

on:
  push:
    paths:
      - '.lean/**'
      - '.claude/**'
      - '.github/workflows/lean-workflow.yml'
      - '.github/pull_request_template.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths:
      - '.lean/**'
      - '.claude/**'
      - '.github/workflows/lean-workflow.yml'
      - '.github/pull_request_template.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.gitignore'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck .claude/hooks/*.sh .lean/bin/*.sh .lean/scripts/*.sh .lean/tests/*.sh

      - name: Structure
        run: .lean/scripts/check-structure.sh

      - name: Mode tests
        run: .lean/tests/test-mode.sh

      - name: Tracker tests
        run: .lean/tests/test-tracker.sh

      - name: Hook tests
        run: .lean/tests/test-hooks.sh

      - name: Queue tests
        run: .lean/tests/test-queue.sh
