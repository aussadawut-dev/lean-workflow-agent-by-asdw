name: Lean Workflow

on:
  push:
    paths:
      - '.lean/**'
      - '.claude/**'
      - '.agents/skills/**'
      - '.github/workflows/lean-workflow.yml'
      - '.github/pull_request_template.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths:
      - '.lean/**'
      - '.claude/**'
      - '.agents/skills/**'
      - '.github/workflows/lean-workflow.yml'
      - '.github/pull_request_template.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.gitignore'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: ShellCheck
        run: shellcheck .claude/hooks/*.sh .lean/scripts/*.sh .lean/tests/*.sh

      - name: Structure
        run: .lean/scripts/check-structure.sh

      - name: Hook tests
        run: .lean/tests/test-hooks.sh

      - name: Mode configuration
        run: python3 .lean/scripts/workflow.py check

      - name: Workflow regression tests
        run: python3 -m unittest discover -s .lean/tests -p 'test_*.py'
