name: Lean Workflow

on:
  push:
    paths:
      - '.lean/**'
      - '.claude/**'
      - '.agents/skills/**'
      - '.codex/**'
      - 'docs/**'
      - 'evals/**'
      - 'tools/**'
      - '.github/workflows/lean-workflow.yml'
      - '.github/pull_request_template.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths:
      - '.lean/**'
      - '.claude/**'
      - '.agents/skills/**'
      - '.codex/**'
      - 'docs/**'
      - 'evals/**'
      - 'tools/**'
      - '.github/workflows/lean-workflow.yml'
      - '.github/pull_request_template.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.gitignore'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ShellCheck
        if: runner.os == 'macOS'
        run: command -v shellcheck || brew install shellcheck

      - name: ShellCheck
        run: shellcheck .claude/hooks/*.sh .lean/scripts/*.sh .lean/tests/*.sh

      - name: Structure
        run: .lean/scripts/check-structure.sh

      - name: Hook tests
        run: .lean/tests/test-hooks.sh

      - name: Mode configuration
        run: python3 .lean/scripts/workflow.py check

      - name: Project model catalog
        run: python3 .lean/scripts/model_catalog.py check

      - name: Workflow regression tests
        run: python3 .lean/tests/run_tests.py

      - name: Eval graders and fixtures (no model calls)
        run: |
          python3 -m unittest discover -s evals -p 'test_*.py'
          python3 evals/run_evals.py --dry-run

      - name: Repository tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
