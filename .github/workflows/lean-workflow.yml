name: Lean Workflow

# The full suite runs here on every push and pull request; agents run `lean test --changed` locally.
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Git for test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: Lint
        run: python3 .lean/bin/lean lint

      - name: Mode configuration
        run: python3 .lean/bin/lean mode check

      - name: Model list
        run: python3 .lean/bin/lean models check

      - name: Full test suite
        run: python3 .lean/bin/lean test --all
